---
- name: Require actual revision and CI secrets
  ansible.builtin.assert:
    that:
      - clinic_repo_revision is match('^[a-f0-9]{40}$')
      - vault_jenkins_admin_password | length >= 24
      - vault_registry_write_token | length > 0
  no_log: true
- name: Prepare project checkout directory
  ansible.builtin.file: {path: "{{ clinic_repo_dir }}", state: directory, owner: clinicops, mode: '0750'}
- name: Install credential-free askpass helper
  ansible.builtin.copy:
    dest: /usr/local/bin/clinic-git-askpass
    mode: '0755'
    content: |
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' "${CLINIC_GITHUB_USER:-vxxngw}" ;;
        *Password*) printf '%s\n' "$CLINIC_GITHUB_TOKEN" ;;
        *) exit 1 ;;
      esac
- name: Checkout exact project revision over verified HTTPS
  become_user: clinicops
  ansible.builtin.git:
    repo: "{{ clinic_repo_url }}"
    dest: "{{ clinic_repo_dir }}"
    version: "{{ clinic_repo_revision }}"
    force: false
  environment:
    GIT_ASKPASS: /usr/local/bin/clinic-git-askpass
    GIT_TERMINAL_PROMPT: '0'
    CLINIC_GITHUB_TOKEN: "{{ vault_github_read_token | default('') }}"
  register: clinic_checkout
  no_log: true
- name: Initialize local CI environment once, preserving agent secret on reruns
  ansible.builtin.copy:
    dest: "{{ clinic_repo_dir }}/.env.ci"
    owner: clinicops
    mode: '0600'
    force: false
    content: |
      CLINIC_JENKINS_ADMIN_PASSWORD={{ vault_jenkins_admin_password }}
      CLINIC_JENKINS_AGENT_SECRET=
  no_log: true
- name: Install ignored registry credential
  ansible.builtin.copy:
    dest: "{{ clinic_repo_dir }}/.registry-token"
    owner: clinicops
    mode: '0600'
    content: "{{ vault_registry_write_token }}"
  no_log: true
- name: Install isolated bootstrap Python dependency
  ansible.builtin.pip:
    name: httpx==0.28.1
    virtualenv: /opt/clinic-bootstrap-venv
    virtualenv_command: python3 -m venv
- name: Start authenticated controller and isolated rootless engine
  community.docker.docker_compose_v2:
    project_src: "{{ clinic_repo_dir }}"
    files: [compose.ci.yaml, compose.ci.vm.yaml]
    env_files: [.env.ci]
    services: [controller, engine]
    build: "{{ 'always' if clinic_checkout.changed else 'policy' }}"
    wait: true
    wait_timeout: 300
  no_log: true
- name: Inspect bootstrap marker
  ansible.builtin.stat: {path: "{{ clinic_repo_dir }}/.ci-local/ansible-bootstrap-ready"}
  register: clinic_bootstrap_marker
- name: Configure controller, SCM credentials and agent when source changed
  ansible.builtin.command:
    argv: [/opt/clinic-bootstrap-venv/bin/python, scripts/bootstrap-ci.py, configure]
    chdir: "{{ clinic_repo_dir }}"
  environment:
    CLINIC_GITHUB_TOKEN: "{{ vault_github_read_token | default('') }}"
    CLINIC_REGISTRY_USER: "{{ clinic_registry_user | default('vxxngw') }}"
    CLINIC_REGISTRY: "ghcr.io/{{ clinic_registry_user | default('vxxngw') }}"
    CLINIC_REPO_URL: "{{ clinic_repo_url }}"
    CLINIC_SOURCE_REF: "{{ clinic_repo_revision }}"
    CLINIC_SOURCE_BRANCH: "{{ clinic_source_branch | default('deploy/baolong205-jenkins') }}"
  no_log: true
  when: clinic_checkout.changed or not clinic_bootstrap_marker.stat.exists
- name: Ensure bootstrap marker directory
  ansible.builtin.file: {path: "{{ clinic_repo_dir }}/.ci-local", state: directory, owner: clinicops, mode: '0700'}
- name: Record configured revision
  ansible.builtin.copy:
    dest: "{{ clinic_repo_dir }}/.ci-local/ansible-bootstrap-ready"
    content: "{{ clinic_repo_revision }}\n"
    owner: clinicops
    mode: '0600'
- name: Start non-root build agent
  community.docker.docker_compose_v2:
    project_src: "{{ clinic_repo_dir }}"
    files: [compose.ci.yaml, compose.ci.vm.yaml]
    env_files: [.env.ci]
    profiles: [agent]
    services: [agent]
    build: "{{ 'always' if clinic_checkout.changed else 'policy' }}"
    wait: true
    wait_timeout: 300
  no_log: true
